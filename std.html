<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --text: #1b2437;
            --muted: #667085;
            --border: #e4e8f0;
            --primary: #2f4bd8;
            --primary-dark: #2339b0;
            --success: #12805c;
            --success-bg: #e3f5ee;
            --danger: #c9302c;
            --danger-bg: #fdeceb;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* ---------- Header ---------- */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .topbar h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .topbar p {
            margin: 2px 0 0;
            font-size: 0.9rem;
            color: var(--muted);
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 16px;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn:focus-visible {
            outline: 3px solid rgba(47, 75, 216, 0.35);
            outline-offset: 2px;
        }

        .back {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border);
        }
        .back:hover { background: #eef1f7; }

        /* ---------- Layout ---------- */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* ---------- Card ---------- */
        .card {
            max-width: 440px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        }

        .card img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #e9edf5;
        }

        .card-body {
            padding: 24px;
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .sid {
            margin: 2px 0 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .badge {
            flex-shrink: 0;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 999px;
        }
        .badge.present { background: var(--success-bg); color: var(--success); }
        .badge.absent  { background: var(--danger-bg);  color: var(--danger); }

        .details {
            margin: 0 0 24px;
            padding: 0;
            border-top: 1px solid var(--border);
        }

        .details div {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .details dt {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .details dd {
            margin: 0;
            font-weight: 500;
            text-align: right;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            .topbar-inner { padding: 16px; }
            main { padding: 24px 16px 40px; }
            .card-body { padding: 18px; }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div>
                <h1>Student Details</h1>
                <p>Full record for this student</p>
            </div>
            <a href="/" class="btn back">&larr; Back to Home</a>
        </div>
    </header>

    <main>
        <div class="card">

            <img src="{{ student[6] }}" alt="Photo of {{ student[1] }}">

            <div class="card-body">

                <div class="card-head">
                    <div>
                        <h2>{{ student[1] }}</h2>
                        <p class="sid">Student ID: {{ student[0] }}</p>
                    </div>
                    {% if student[7] == 1 %}
                    <span class="badge present">Present</span>
                    {% else %}
                    <span class="badge absent">Absent</span>
                    {% endif %}
                </div>

                <dl class="details">
                    <div>
                        <dt>Age</dt>
                        <dd>{{ student[2] }}</dd>
                    </div>
                    <div>
                        <dt>Gender</dt>
                        <dd>{{ student[3] }}</dd>
                    </div>
                    <div>
                        <dt>Marks</dt>
                        <dd>{{ student[4] }}</dd>
                    </div>
                    <div>
                        <dt>Course</dt>
                        <dd>{{ student[5] }}</dd>
                    </div>
                </dl>

                <a href="/" class="btn back">Back to Home</a>

            </div>
        </div>
    </main>

</body>
</html>
